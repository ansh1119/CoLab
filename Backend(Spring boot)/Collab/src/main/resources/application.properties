spring.application.name=Collab

# H2 Database Configuration (Commented out)
# spring.datasource.url=jdbc:h2:mem:collabdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=password
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/colabcraft?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=colabuser
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# H2 Console (Disabled)
spring.h2.console.enabled=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server Port
server.port=8081

# Serialize LocalDate/LocalDateTime as ISO strings instead of arrays
spring.jackson.serialization.write-dates-as-timestamps=false
